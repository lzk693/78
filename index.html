<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
/* 初始点击提示框 */
.start-box{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:#222;
  padding:40px 60px;
  border:2px solid #3366cc;
  border-radius:12px;
  background:#f0f6ff;
  cursor:pointer;
  z-index:10;
}
/* 全屏图片，默认隐藏 */
.full-img{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  display:none;
}
</style>
</head>
<body>
<div class="start-box" id="box">点击查看成绩</div>
<img class="full-img" id="img" src="666.jpg">
<audio id="audio" preload="auto" src="好声音.mp3">

<script>
const box = document.getElementById('box');
const img = document.getElementById('img');
const audio = document.getElementById('audio');
audio.volume = 1;

box.onclick = async ()=>{
  box.style.display = 'none';
  img.style.display = 'block';
  // 尝试开启全屏（部分浏览器支持）
  if(img.requestFullscreen){
    await img.requestFullscreen().catch(e=>{})
  }else if(img.webkitRequestFullscreen){
    await img.webkitRequestFullscreen().catch(e=>{})
  }
  audio.play();
}
</script>
</body>
</html>
